version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: testhub-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-testhub123}
      MYSQL_DATABASE: ${DB_NAME:-testhub}
      MYSQL_USER: ${DB_USER:-testhub}
      MYSQL_PASSWORD: ${DB_PASSWORD:-testhub123}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - testhub-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Redis (for Celery and caching)
  redis:
    image: redis:7-alpine
    container_name: testhub-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - testhub-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      retries: 5

  # Backend (Django)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: testhub-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-backend,localhost,127.0.0.1}
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-testhub}
      - DB_USER=${DB_USER:-testhub}
      - DB_PASSWORD=${DB_PASSWORD:-testhub123}
      - DB_PORT=3306
      - REDIS_URL=redis://redis:6379/0
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost}
      - LANGUAGE_CODE=${LANGUAGE_CODE:-zh-hans}
      - TIME_ZONE=${TIME_ZONE:-Asia/Shanghai}
    volumes:
      - ./media:/app/media
      - ./logs:/app/logs
      - static_volume:/app/static
    networks:
      - testhub-network
    expose:
      - "8000"
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 4 backend.wsgi:application"

  # Celery Worker
  celery:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: testhub-celery
    restart: unless-stopped
    depends_on:
      - db
      - redis
      - backend
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-testhub}
      - DB_USER=${DB_USER:-testhub}
      - DB_PASSWORD=${DB_PASSWORD:-testhub123}
      - DB_PORT=3306
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./media:/app/media
      - ./logs:/app/logs
    networks:
      - testhub-network
    command: >
      sh -c "celery -A backend worker --loglevel=info"

  # Celery Beat (for scheduled tasks)
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: testhub-celery-beat
    restart: unless-stopped
    depends_on:
      - db
      - redis
      - backend
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-testhub}
      - DB_USER=${DB_USER:-testhub}
      - DB_PASSWORD=${DB_PASSWORD:-testhub123}
      - DB_PORT=3306
      - REDIS_URL=redis://redis:6379/0
    networks:
      - testhub-network
    command: >
      sh -c "celery -A backend beat --loglevel=info"

  # Frontend (Vue.js + Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: testhub-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      - static_volume:/app/static:ro
      - ./media:/app/media:ro
    networks:
      - testhub-network

networks:
  testhub-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  static_volume:
